<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>招聘 Agent · 简历筛选</title>
  <!-- 单一验证方向：让第一次打开页面的人在 10 秒内看懂“收到简历—看筛选卡—负责人决定”。 -->
  <style>
    :root{
      --ink:#17201b;--muted:#667069;--soft:#f4f6f2;--paper:#fafbf8;--surface:#fff;
      --line:#dde2dc;--line-strong:#bdc6be;--blue:#2856d9;--blue-soft:#edf2ff;
      --green:#176b4d;--green-soft:#eaf5ef;--amber:#9b5b18;--amber-soft:#fff4e3;
      --red:#a83d37;--red-soft:#fcedeb;--shadow:0 18px 55px rgba(31,43,35,.08);
    }
    *{box-sizing:border-box}
    html{background:var(--paper);color:var(--ink)}
    body{margin:0;min-height:100vh;font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;font-size:14px;letter-spacing:-.012em}
    button,select,textarea,input{font:inherit;color:inherit}
    button,select,summary,a,label{touch-action:manipulation}
    button{cursor:pointer}
    h1,h2,h3,p{margin-top:0}
    a{color:inherit}
    .mono{font-family:"SFMono-Regular",Consolas,monospace;letter-spacing:0}
    .demo-note{min-height:36px;padding:8px 18px;display:flex;justify-content:center;align-items:center;gap:7px;background:#fff8e8;border-bottom:1px solid #eadfc7;color:#6e5a33;font-size:12px;text-align:center}
    .shell{width:min(100%,1080px);margin:0 auto;padding:0 30px 72px}
    .topbar{min-height:72px;display:flex;align-items:center;justify-content:space-between;gap:20px}
    .brand{display:flex;align-items:center;gap:11px;font-weight:820}
    .brand-mark{width:34px;height:34px;border-radius:10px;background:var(--ink);color:#d8ff5d;display:grid;place-items:center;font-weight:900}
    .brand-copy span{display:block;color:var(--muted);font-size:11px;font-weight:600;margin-top:2px}
    .back-link{font-size:12px;color:var(--muted);text-decoration:none;border-bottom:1px solid transparent}
    .back-link:hover{color:var(--ink);border-color:var(--ink)}
    .page-head{padding:30px 0 22px}
    .kicker{font-size:11px;color:var(--blue);font-weight:800;letter-spacing:.1em;text-transform:uppercase}
    .page-head h1{font-size:38px;line-height:1.05;letter-spacing:-.05em;margin:8px 0 10px}
    .page-head p{max-width:680px;color:var(--muted);font-size:15px;line-height:1.7;margin:0}
    .stepper{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:18px}
    .step{display:grid;grid-template-columns:30px 1fr;gap:10px;align-items:center;padding:13px 14px;border:1px solid var(--line);border-radius:13px;background:rgba(255,255,255,.66);color:var(--muted)}
    .step-no{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:#eef0ec;font-size:12px;font-weight:800}
    .step b{display:block;font-size:13px;color:inherit}
    .step span:last-child{display:block;font-size:11px;margin-top:3px}
    .step.active{border-color:#b8c7f7;background:var(--blue-soft);color:var(--blue)}
    .step.active .step-no{background:var(--blue);color:#fff}
    .step.done{color:var(--green)}
    .step.done .step-no{background:var(--green-soft);color:var(--green)}
    .surface{background:var(--surface);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);overflow:hidden}
    .surface-head{padding:22px 24px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:18px;align-items:flex-start}
    .surface-head h2{font-size:24px;letter-spacing:-.035em;margin:5px 0 7px}
    .surface-head p{color:var(--muted);line-height:1.55;margin:0;max-width:640px}
    .surface-actions{display:grid;justify-items:end;gap:10px;flex:0 0 auto}
    .surface-body{padding:24px}
    .eyebrow{font-size:10px;letter-spacing:.12em;text-transform:uppercase;font-weight:800;color:#747d76}
    .small{font-size:12px;color:var(--muted);line-height:1.55}
    .pill{display:inline-flex;align-items:center;gap:6px;padding:5px 9px;border-radius:999px;border:1px solid var(--line);background:#fff;font-size:10px;font-weight:760;white-space:nowrap}
    .pill.good{color:var(--green);background:var(--green-soft);border-color:#cfe5d9}
    .pill.blue{color:var(--blue);background:var(--blue-soft);border-color:#d6dfff}
    .pill.warn{color:var(--amber);background:var(--amber-soft);border-color:#efd8b8}
    .pill.danger{color:var(--red);background:var(--red-soft);border-color:#edcbc8}
    .dot{width:6px;height:6px;border-radius:50%;background:currentColor}
    .btn{min-height:42px;padding:9px 15px;border:1px solid var(--line-strong);border-radius:11px;background:#fff;font-weight:760;display:inline-flex;justify-content:center;align-items:center;gap:7px;text-decoration:none}
    .btn:hover{border-color:#8f9991}
    .btn:focus-visible,.signal:focus-visible,.choice:focus-within,summary:focus-visible{outline:3px solid rgba(40,86,217,.22);outline-offset:2px}
    .btn:disabled{opacity:.42;cursor:not-allowed}
    .btn.primary{color:#fff;background:var(--blue);border-color:var(--blue);box-shadow:0 8px 22px rgba(40,86,217,.2)}
    .btn.secondary{background:var(--soft)}
    .btn.danger{color:var(--red);border-color:#dba8a4;background:#fff}
    .btn.tiny{min-height:34px;padding:6px 10px;font-size:11px}
    .intake{display:grid;grid-template-columns:1fr 46px 1fr;gap:18px;align-items:stretch}
    .identity-card{padding:18px;border:1px solid var(--line);border-radius:15px;background:var(--paper)}
    .identity-top{display:flex;align-items:center;gap:12px;margin-bottom:17px}
    .avatar,.role-icon{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-weight:850;background:#e9eee9;color:var(--ink)}
    .role-icon{background:var(--blue-soft);color:var(--blue)}
    .identity-card h3{font-size:18px;margin:0 0 3px}
    .facts{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
    .fact{padding:10px;background:#fff;border:1px solid #e7ebe6;border-radius:10px}
    .fact span{display:block;color:var(--muted);font-size:10px;margin-bottom:4px}
    .fact b{font-size:12px}
    .flow-arrow{display:grid;place-items:center;color:#9aa39c;font-size:20px}
    .callout{margin-top:16px;padding:13px 14px;border:1px solid var(--line);border-radius:12px;background:var(--soft);font-size:12px;line-height:1.6}
    .callout.good{background:var(--green-soft);border-color:#cfe5d9}
    .callout.blue{background:var(--blue-soft);border-color:#d6dfff}
    .callout.warn{background:var(--amber-soft);border-color:#efd8b8}
    .callout.danger{background:var(--red-soft);border-color:#edcbc8}
    .primary-row{display:flex;justify-content:flex-end;align-items:center;gap:12px;margin-top:20px}
    .primary-row .small{max-width:480px;margin-right:auto}
    .neutral-summary{padding:18px;border-radius:14px;background:#f3f6ff;border:1px solid #dae2ff;font-size:18px;line-height:1.55;font-weight:720;letter-spacing:-.025em}
    .neutral-summary span{display:block;color:var(--blue);font-size:10px;text-transform:uppercase;letter-spacing:.1em;margin-bottom:6px}
    .signal-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:11px;margin-top:16px}
    .signal-group{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#fff}
    .signal-title{padding:12px 13px;background:var(--soft);border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:8px}
    .signal-title b{font-size:13px}
    .signal-title span{font-size:10px;color:var(--muted)}
    .signal{width:100%;border:0;border-bottom:1px solid #ecefeb;background:#fff;text-align:left;padding:13px;color:inherit}
    .signal:last-child{border-bottom:0}
    .signal:hover{background:#fafbf9}
    .signal b{display:block;font-size:12px;margin-bottom:5px}
    .signal span{display:block;font-size:11px;color:var(--muted);line-height:1.5}
    .signal-empty{padding:14px;color:var(--muted);font-size:11px;line-height:1.5}
    .decision-context{padding:14px;border:1px solid var(--line);border-radius:13px;background:var(--paper);display:flex;justify-content:space-between;gap:16px;align-items:flex-start}
    .decision-context b{display:block;margin-bottom:4px}
    .choices{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}
    .choice{position:relative;display:block;padding:15px;border:1px solid var(--line);border-radius:13px;background:#fff;cursor:pointer;min-height:112px}
    .choice.selected{border-color:#8fa8ef;background:var(--blue-soft);box-shadow:inset 0 0 0 1px #8fa8ef}
    .choice input{position:absolute;right:13px;top:13px}
    .choice b{display:block;font-size:15px;padding-right:24px;margin-bottom:8px}
    .choice span{display:block;font-size:11px;color:var(--muted);line-height:1.5}
    .decision-form{display:grid;grid-template-columns:minmax(0,1fr) 230px;gap:10px;margin-top:12px}
    .field label{display:block;font-size:11px;font-weight:760;margin-bottom:6px}
    textarea,input,select{width:100%;border:1px solid var(--line-strong);border-radius:10px;background:#fff;padding:10px 11px}
    textarea{min-height:92px;resize:vertical;line-height:1.5}
    input,select{height:42px}
    .choice input[type="radio"]{width:18px;height:18px;padding:0;border:0;border-radius:50%;accent-color:var(--blue)}
    textarea:disabled,input:disabled{background:#f1f3ef;color:#899189}
    .after-choice{margin-top:10px;color:var(--muted);font-size:11px;line-height:1.55}
    .receipt-hero{text-align:center;padding:8px 0 18px}
    .receipt-mark{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;margin:0 auto 12px;background:var(--green-soft);color:var(--green);font-size:22px;font-weight:900}
    .receipt-hero h2{font-size:27px;letter-spacing:-.04em;margin-bottom:7px}
    .receipt-hero p{color:var(--muted);line-height:1.6;max-width:620px;margin:0 auto}
    .receipt-note{margin-top:12px;padding:14px;border-radius:12px;background:var(--soft);line-height:1.6}
    .folds{display:grid;gap:10px;margin-top:14px}
    details.fold,details.test-panel{border:1px solid var(--line);border-radius:14px;background:rgba(255,255,255,.72);overflow:hidden}
    details.fold>summary,details.test-panel>summary{list-style:none;padding:15px 17px;cursor:pointer;font-weight:780;display:flex;justify-content:space-between;align-items:center;gap:12px}
    details.fold>summary::-webkit-details-marker,details.test-panel>summary::-webkit-details-marker{display:none}
    details.fold>summary::after,details.test-panel>summary::after{content:"＋";font-size:18px;color:var(--muted);font-weight:400}
    details[open]>summary::after{content:"−"}
    details.fold>summary span,details.test-panel>summary span{font-size:11px;color:var(--muted);font-weight:500}
    .fold-body{padding:0 17px 17px;border-top:1px solid var(--line)}
    .runtime-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:15px}
    .runtime-card{padding:13px;border:1px solid var(--line);border-radius:11px;background:var(--paper)}
    .runtime-card h3{font-size:12px;margin-bottom:9px}
    .runtime-row{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid #e8ebe7;font-size:10px}
    .runtime-row:last-child{border-bottom:0}
    .runtime-row b{text-align:right}
    .activity-list{margin-top:10px}
    .activity-item{display:grid;grid-template-columns:12px 1fr auto;gap:8px;align-items:start;padding:8px 0;border-bottom:1px solid #ecefeb;font-size:11px;line-height:1.45}
    .activity-item:last-child{border-bottom:0}
    .activity-dot{width:7px;height:7px;border-radius:50%;background:#aeb6af;margin-top:4px}
    .activity-dot.danger{background:var(--red)}
    .activity-time{color:#939b94;font-size:9px}
    .test-body{padding:0 17px 17px;border-top:1px solid var(--line)}
    .test-grid{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:end;margin-top:15px}
    .attempt{padding:8px 0;border-bottom:1px solid var(--line);font-size:11px;line-height:1.45}
    .attempt:last-child{border-bottom:0}
    .backdrop{position:fixed;z-index:80;inset:0;background:rgba(20,27,23,.44);display:flex;justify-content:flex-end}
    .drawer{width:min(520px,100%);height:100%;padding:23px;background:#fff;box-shadow:-18px 0 60px rgba(0,0,0,.16);overflow:auto}
    .drawer-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
    .drawer h2{font-size:25px;letter-spacing:-.035em;margin:6px 0 12px}
    .quote{margin:17px 0 0;padding:17px;border-left:3px solid var(--blue);background:#f3f6ff;font-size:15px;line-height:1.7}
    .drawer-section{padding-top:15px;margin-top:15px;border-top:1px solid var(--line)}
    .drawer-section h3{font-size:12px;margin-bottom:7px}
    .drawer-section p{color:#4d5650;line-height:1.65;margin:0}
    .locator{display:grid;grid-template-columns:120px 1fr;gap:8px;margin-top:12px;padding:13px;background:var(--soft);font-size:11px}
    .toast{position:fixed;z-index:100;right:20px;top:20px;padding:12px 15px;border-radius:10px;background:var(--ink);color:#fff;box-shadow:var(--shadow);opacity:0;transform:translateY(-8px);pointer-events:none;transition:.2s}
    .toast.show{opacity:1;transform:none}
    @media(max-width:720px){
      .demo-note{padding:8px 12px;align-items:flex-start}.shell{padding:0 14px 48px}.topbar{min-height:62px}.brand-copy span,.back-link{display:none}
      .page-head{padding:22px 2px 17px}.page-head h1{font-size:31px}.page-head p{font-size:13px}.stepper{gap:6px}.step{display:block;padding:9px;text-align:center}.step-no{margin:0 auto 6px}.step>span:last-child>span{display:none}.step b{font-size:11px}
      .surface{border-radius:16px}.surface-head{padding:18px;display:block}.surface-head>.pill{margin-top:10px}.surface-actions{justify-items:stretch;margin-top:12px}.surface-actions .btn{width:100%}.surface-head h2{font-size:21px}.surface-body{padding:17px}
      .intake{grid-template-columns:1fr}.flow-arrow{transform:rotate(90deg);height:20px}.facts{grid-template-columns:1fr 1fr}.primary-row{display:block}.primary-row .btn{width:100%;margin-top:12px}
      .signal-grid,.choices,.runtime-grid{grid-template-columns:1fr}.neutral-summary{font-size:16px}.choice{min-height:0}.decision-form{grid-template-columns:1fr}.decision-context{display:block}.decision-context>.pill{margin-top:9px}
      .test-grid{grid-template-columns:1fr}.test-grid .btn{width:100%}details.fold>summary span{display:none}.drawer{padding:18px}.locator{grid-template-columns:1fr}.toast{left:14px;right:14px;top:14px;text-align:center}
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script>
    const ScreeningMachine=(()=>{
      const baseDimensions=[
        {name:'AI 产品落地',status:'SUPPORT',claim:'完成两次 AI 产品试点并保留上线复盘。',evidence:2,quote:'“负责智能质检产品从试点到上线，覆盖需求、评测、灰度与复盘。”',locator:'Resume v1 · Experience[2] · p2:L10-L13',why:'直接支持岗位画像中的 AI 产品落地要求。',limits:'材料未证明试点后的长期业务影响。'},
        {name:'从 0 到 1 推进',status:'SUPPORT',claim:'有从问题定义到首版交付的完整经历。',evidence:2,quote:'“从客户访谈开始定义首版范围，联合算法与工程在 10 周内完成交付。”',locator:'Resume v1 · Project[1] · p3:L3-L8',why:'支持从模糊问题到可验证产品路径的能力。',limits:'团队规模与本人最终决策边界仍需面试核验。'},
        {name:'跨团队协作',status:'SUPPORT',claim:'能说明产品、算法、工程与运营的协作机制。',evidence:1,quote:'“建立每周误差复盘与灰度检查表，协调算法、工程、运营共同签收。”',locator:'Resume v1 · Project[2] · p3:L12-L15',why:'支持跨职能推进维度。',limits:'没有同级协作方的独立材料。'},
        {name:'商业结果归因',status:'CONTRA',claim:'材料中的增长结果不能独立归因于候选人的产品动作。',evidence:1,quote:'“试点期客户续费意向提升。”',locator:'Resume v1 · Result[1] · p3:L18',why:'结果方向相关，但缺少分母、时间窗与个人贡献边界。',limits:'不能把团队结果包装成个人确定贡献。'},
        {name:'LLM 评测体系',status:'UNKNOWN',claim:'当前材料没有可独立核验的评测集设计。',evidence:0,quote:'当前结构化简历中未找到评测集构建、切片或失效标准。',locator:'Resume v1 · 全文检索 · no-hit',why:'该维度仍需面试追问。',limits:'未知不是负面证据。'},
        {name:'个人决策边界',status:'UNKNOWN',claim:'项目中的最终决策权与个人贡献范围未说明。',evidence:0,quote:'当前材料使用“团队完成”，未分解候选人职责边界。',locator:'Resume v1 · Project[1-2]',why:'需要用人负责人判断是否值得进入下一轮核验。',limits:'不得用常识补写个人贡献。'},
        {name:'大团队管理',status:'NOT_APPLICABLE',claim:'当前岗位画像未把大团队管理列为本次必要条件。',evidence:0,quote:'Role Profile v3 将此项标记为不适用。',locator:'Role Profile v3 · Dimension[7]',why:'保留画像完整性，但不参与本次材料判断。',limits:'不适用不等于缺失或反证。'}
      ];
      const lowDimensions=baseDimensions.map(x=>({...x}));
      lowDimensions[0]={...lowDimensions[0],status:'UNKNOWN',claim:'AI 产品落地只有职责描述，没有可定位结果。',evidence:0,quote:'“参与 AI 产品相关工作。”',limits:'缺少范围、动作、时间与结果，保持未知。'};
      lowDimensions[1]={...lowDimensions[1],status:'UNKNOWN',claim:'没有从问题定义到首版交付的完整链条。',evidence:0,quote:'当前材料未找到完整链条。'};
      lowDimensions[2]={...lowDimensions[2],status:'CONTRA',claim:'材料只描述个人交付，跨团队机制缺失。',evidence:1};
      const prohibitedDimensions=baseDimensions.map(x=>({...x}));
      prohibitedDimensions.unshift({name:'学校背景',status:'PROHIBITED',claim:'禁用信号被错误带入材料草稿。',evidence:1,quote:'“毕业院校：示例大学。”',locator:'Resume v1 · Education[0]',why:'学校不能进入本次业务匹配。',limits:'必须隔离并重新生成材料，不能只隐藏界面。'});
      const FIXTURES={
        normal:{label:'正常筛选',description:'筛选卡完成后，停在用人负责人决定。',dimensions:baseDimensions},
        lowEvidence:{label:'信息较少',description:'多项待核实不会关闭案件，也不会自动淘汰。',dimensions:lowDimensions},
        prohibited:{label:'发现禁用信号',description:'学校等信号进入草稿时先阻断，修复后可恢复。',dimensions:prohibitedDimensions},
        versionChanged:{label:'简历发生更新',description:'旧筛选卡立即失效，基于新材料重新生成。',dimensions:baseDimensions},
        hold:{label:'稍后复核',description:'负责人暂缓后停止催办，到期恢复一张未选择的新任务。',dimensions:baseDimensions},
        overdue:{label:'负责人暂未反馈',description:'有限催办耗尽后上报，沉默不是招聘决定。',dimensions:baseDimensions},
        recipientError:{label:'通知对象错误',description:'错误收件人在发送前阻断，真实外部效果保持为零。',dimensions:baseDimensions},
        authority:{label:'越权、旧卡与双击',description:'非负责人、旧任务和重复提交不能制造第二个决定。',dimensions:baseDimensions}
      };
      const clone=value=>JSON.parse(JSON.stringify(value));
      const now=(text,time='当前检查点',tone='')=>({text,time,tone});
      function createInitial(fixtureKey='normal'){
        const key=FIXTURES[fixtureKey]?fixtureKey:'normal';
        return {
          fixtureKey:key,step:0,view:0,started:false,caseStage:'RECEIVED',checkpoint:'SCREENING/INPUT/WAIT',
          versions:{resume:'v1',profile:'v3',fields:'v5',policy:'v2',generator:'v2',manifest:'SIM-24081-r1'},
          dimensions:clone(FIXTURES[key].dimensions),assessment:{id:'—',version:0,status:'NONE'},publish:{status:'PENDING',checks:0},
          request:{id:'DPR-24081',revision:0,status:'NONE',generation:1,owner:'周岩',ownerId:'hiring-owner-zhou',dueAt:'今天 11:02'},
          selection:'',reason:'',revisitAt:'',decisionHistory:[],receipts:[],attempts:[],candidateCommunication:'NOT_SENT',

      const canSubmit=!disabled&&screeningState.selection&&screeningState.reason.trim()&&(screeningState.selection!=='HOLD'||screeningState.revisitAt.trim());
      const options=Object.entries(decisionCopy).map(([key,item])=>`<label class="choice ${screeningState.selection===key?'selected':''}"><input type="radio" name="department-decision" value="${a(key)}" ${screeningState.selection===key?'checked':''} ${disabled?'disabled':''}><b>${h(item.label)}</b><span>${h(item.effect)}</span></label>`).join('');
      return `<section class="surface" tabindex="-1" data-surface><div class="surface-head"><div><div class="eyebrow">第 3 步 · 需要你决定</div><h2>用人负责人决定</h2><p>Agent 已完成证据整理，但不会替负责人选择，也不会预选任何选项。</p></div><span class="pill warn"><span class="dot"></span>${h(screeningState.request.dueAt)}前</span></div><div class="surface-body">${exceptionNotice()}<div class="decision-context"><div><b>林可欣 · AI 产品经理</b><span class="small">当前材料：${h(neutralSummary())}</span></div><span class="pill blue">负责人：周岩</span></div><div class="choices">${options}</div>${selected?`<div class="after-choice"><b>提交后：</b>${h(selected.effect)}</div>`:''}<div class="decision-form"><div class="field"><label for="decision-reason">判断依据（必填）</label><textarea id="decision-reason" data-role="decision-reason" placeholder="例如：支持项足以进入一面，待核实项在面试中继续确认" ${disabled?'disabled':''}>${h(screeningState.reason)}</textarea></div><div class="field"><label for="revisit-at">再次查看时间</label><input id="revisit-at" data-role="revisit-at" value="${a(screeningState.revisitAt)}" placeholder="选择“稍后复核”时必填" ${screeningState.selection==='HOLD'&&!disabled?'':'disabled'}></div></div><div class="primary-row"><span class="small">三个选项默认都不选择；只有当前负责人可以提交。</span><button class="btn primary" data-action="submit-decision" ${canSubmit?'':'disabled'}>提交你的决定</button></div></div></section>`;
    }
    function receiptSurface(){
      const receipt=screeningState.decisionHistory.at(-1);
      if(!receipt)return decisionSurface();
      const copy=decisionCopy[receipt.decision]||{label:'决定已记录',effect:''};
      const hold=receipt.decision==='HOLD'&&screeningState.request.status==='ON_HOLD';
      const invite=receipt.decision==='INVITE';
      return `<section class="surface" tabindex="-1" data-surface><div class="surface-body"><div class="receipt-hero"><div class="receipt-mark">✓</div><h2>${h(copy.label)}已记录</h2><p>${hold?'Agent 已停止催办，到期只恢复一张未选择的新任务。':'决定已绑定当前负责人和当前材料。候选人沟通没有在本动作中发送。'}</p></div><div class="receipt-note"><b>${h(receipt.humanActor)}</b><br>判断依据：${h(receipt.reason)}${receipt.revisitAt?`<br>再次查看：${h(receipt.revisitAt)}`:''}</div>${hold?`<div class="primary-row"><span class="small">Demo 操作：模拟到达负责人设定的时间。</span><button class="btn primary" data-action="reach-revisit">到达复核时间</button></div>`:''}${invite?`<div class="primary-row"><span class="small">下一块产品：Agent 自动准备时段，候选人只处理本人必须完成的选择。</span><a class="btn primary" href="./招聘Agent_核心功能3_候选人约面Demo.html">查看候选人约面</a></div>`:''}</div></section>`;
    }
    function activityRows(){
      return screeningState.activity.map(item=>`<div class="activity-item"><span class="activity-dot ${toneClass(item.tone)}"></span><span>${h(item.text)}</span><span class="activity-time">${h(item.time)}</span></div>`).join('');
    }
    function runtimeDetails(){
      const waiting=screeningState.request.status==='OPEN'?'用人负责人周岩':screeningState.request.status==='ON_HOLD'?'负责人设定的复核时间':screeningState.publish.status==='BLOCKED'?'安全复核':'无';
      const attempts=screeningState.attempts.map(item=>`<div class="attempt"><b>${h(item.result)}</b> · ${h(item.actor)} · ${h(item.actionId)}</div>`).join('');
      const recoveries=screeningState.recoveryTrail.map(item=>`<div class="attempt"><b>${h(item.result)}</b> · ${h(item.action)}<br><span class="small">${h(item.checkpoint)}</span></div>`).join('');
      const overdueControl=screeningState.fixtureKey==='overdue'&&screeningState.request.status==='OPEN'&&!screeningState.reminders.paused?`<div class="callout blue"><b>Demo：有限催办</b><br>每次只推进一个检查点，最多 ${h(screeningState.reminders.max)} 次；耗尽后只上报一次。<div style="margin-top:10px"><button class="btn tiny secondary" data-action="advance-reminder">推进一次催办检查</button></div></div>`:'';
      const authorityControls=screeningState.fixtureKey==='authority'&&screeningState.request.status==='OPEN'?`<div class="callout danger"><b>安全边界测试</b><br>下面两次操作都应被拒绝。<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px"><button class="btn tiny danger" data-action="attack-agent">模拟 Agent 越权提交</button><button class="btn tiny danger" data-action="attack-stale">模拟旧卡提交</button></div></div>`:'';
      const repeatControl=screeningState.fixtureKey==='authority'&&screeningState.decisionHistory.length?`<div class="callout blue"><b>重复提交测试</b><br>重复同一动作只返回原回执，不产生第二个决定。<div style="margin-top:10px"><button class="btn tiny secondary" data-action="repeat-submit">重复提交同一动作</button></div></div>`:'';
      return `<details class="fold" data-panel="runtime-details"><summary>运行详情 <span>版本、Agent Activity、催办与安全回执</span></summary><div class="fold-body"><div class="runtime-grid"><section class="runtime-card"><h3>当前版本</h3><div class="runtime-row"><span>简历</span><b>${h(screeningState.versions.resume)}</b></div><div class="runtime-row"><span>岗位画像</span><b>${h(screeningState.versions.profile)}</b></div><div class="runtime-row"><span>输入清单</span><b class="mono">${h(screeningState.versions.manifest)}</b></div><div class="runtime-row"><span>当前修订</span><b>${h(screeningState.request.revision)}</b></div><div style="margin-top:9px"><button class="btn tiny secondary" data-action="versions">查看完整版本链</button></div></section><section class="runtime-card"><h3>等待与催办</h3><div class="runtime-row"><span>等待对象</span><b>${h(waiting)}</b></div><div class="runtime-row"><span>下一次检查</span><b>${h(screeningState.reminders.nextCheck)}</b></div><div class="runtime-row"><span>催办次数</span><b>${h(screeningState.reminders.ordinal)} / ${h(screeningState.reminders.max)}</b></div><div class="runtime-row"><span>静默时段</span><b>${h(screeningState.reminders.quietHours)}</b></div></section><section class="runtime-card"><h3>能力真实性</h3><div class="runtime-row"><span>唯一产品任务</span><b>${h(screeningState.request.id)}</b></div><div class="runtime-row"><span>通知回执</span><b>${h(screeningState.notification.status)}</b></div><div class="runtime-row"><span>候选人沟通</span><b>未发送</b></div><div class="runtime-row"><span>真实外部效果</span><b>0</b></div></section></div><div class="drawer-section"><h3>Agent Activity / Agent 运行记录</h3><div class="activity-list">${activityRows()}</div></div>${overdueControl}${authorityControls}${repeatControl}${attempts?`<div class="drawer-section"><h3>被拒绝的尝试</h3>${attempts}</div>`:''}${recoveries?`<div class="drawer-section"><h3>恢复记录</h3>${recoveries}</div>`:''}<div class="callout"><b>外部效果均为合成。</b> Demo 不读取真实简历，不向真实负责人或候选人发送任何内容。</div></div></details>`;
    }
    function scenarioPanel(){
      const fixture=ScreeningMachine.FIXTURES[screeningState.fixtureKey];
      return `<details class="test-panel"><summary>测试其他情况 <span>8 个合成场景，不影响默认主路径</span></summary><div class="test-body"><div class="test-grid"><div class="field"><label for="fixture">选择场景</label><select id="fixture" data-role="fixture">${Object.entries(ScreeningMachine.FIXTURES).map(([key,item])=>`<option value="${a(key)}" ${key===screeningState.fixtureKey?'selected':''}>${h(item.label)}</option>`).join('')}</select></div><button class="btn secondary" data-action="reset">重置当前场景</button></div><p class="small" style="margin:10px 0 0">${h(fixture.description)}</p></div></details>`;
    }
    function evidenceDrawer(){
      if(!screeningState.evidenceOpen)return '';
      const item=screeningState.dimensions[screeningState.evidenceIndex]||screeningState.dimensions[0];
      const meta=statusMeta[item.status]||['待核实','blue'];
      return `<div class="backdrop" data-action="close-drawer"><aside class="drawer" role="dialog" aria-modal="true" aria-label="筛选证据详情" data-stop-propagation><div class="drawer-top"><div><div class="eyebrow">原文证据</div><h2>${h(item.name)}</h2></div><button class="btn tiny" data-action="close-drawer">关闭</button></div><span class="pill ${toneClass(meta[1])}">${h(meta[0])}</span><blockquote class="quote">${h(item.quote)}</blockquote><section class="drawer-section"><h3>这条材料说明什么</h3><p>${h(item.claim)}</p></section><section class="drawer-section"><h3>为什么与岗位相关</h3><p>${h(item.why)}</p></section><section class="drawer-section"><h3>它不能证明什么</h3><p>${h(item.limits)}</p></section><details class="drawer-section"><summary>查看证据定位与内部映射</summary><div class="locator"><span>普通中文</span><b>${h(meta[0])}</b><span>内部状态</span><b class="mono">${h(item.status)}</b><span>原文位置</span><b>${h(item.locator)}</b><span>证据数量</span><b>${h(item.evidence)}</b><span>当前材料</span><b>${h(screeningState.assessment.id)}</b></div></details><div class="callout blue">原文、结论与局限同时展示；“待核实”不是负面证据。</div></aside></div>`;
    }
    function versionsDrawer(){
      if(!screeningState.versionsOpen)return '';
      return `<div class="backdrop" data-action="close-drawer"><aside class="drawer" role="dialog" aria-modal="true" aria-label="运行版本详情" data-stop-propagation><div class="drawer-top"><div><div class="eyebrow">运行详情</div><h2>当前版本链</h2></div><button class="btn tiny" data-action="close-drawer">关闭</button></div><div class="callout ${screeningState.stale?'danger':'good'}"><b>${screeningState.stale?'旧版本已失效':'当前版本一致'}</b><br>${screeningState.stale?'旧筛选卡只读，等待基于新材料重建。':'输入变化会创建新版本，不会静默改写负责人看到的卡片。'}</div><div class="locator"><span>案件</span><b>AP-24081 · Epoch 1</b><span>结构化简历</span><b>${h(screeningState.versions.resume)}</b><span>岗位画像</span><b>${h(screeningState.versions.profile)}</b><span>允许字段</span><b>${h(screeningState.versions.fields)}</b><span>筛选策略</span><b>${h(screeningState.versions.policy)}</b><span>生成器</span><b>${h(screeningState.versions.generator)}</b><span>输入清单</span><b>${h(screeningState.versions.manifest)}</b><span>当前材料</span><b>${h(screeningState.assessment.id)}</b><span>任务修订 / 代次</span><b>${h(screeningState.request.revision)} / ${h(screeningState.request.generation)}</b></div></aside></div>`;
    }
    function mainSurface(){
      if(!screeningState.started&&screeningState.step===0)return intakeSurface();
      if(screeningState.view===4&&screeningState.decisionHistory.length)return receiptSurface();
      if(screeningState.view>=3&&!screeningState.stale)return decisionSurface();
      return screeningSurface();
    }
    function renderScreening(){
      const status=currentStatus();
      const modalOpen=screeningState.evidenceOpen||screeningState.versionsOpen;
      document.getElementById('app').innerHTML=`<div class="demo-note"><b>产品 Demo · 全部为合成数据</b><span>不读取真实简历，不向任何真实人员发送。</span></div><div class="shell"${modalOpen?' inert aria-hidden="true"':''}><header class="topbar"><div class="brand"><div class="brand-mark">H</div><div class="brand-copy">招聘 Agent<span>简历筛选 Demo</span></div></div><a class="back-link" href="./招聘Agent_产品形态Demo_v1.html?variant=B">返回全流程</a></header><main><section class="page-head"><div class="kicker">简历筛选</div><h1>从简历到负责人决定</h1><p>Agent 把简历整理成一张有原文依据的筛选卡；进入一面、稍后复核或本岗位不推进，始终由用人负责人决定。</p></section>${stepper()}${mainSurface()}<section class="folds" aria-label="渐进披露信息">${runtimeDetails()}${scenarioPanel()}</section></main></div>${evidenceDrawer()}${versionsDrawer()}`;
      bindScreening();
    }
    function focusAfterRender(selector='[data-surface]'){
      if(!selector)return;
      setTimeout(()=>{const target=document.querySelector(selector);if(target&&typeof target.focus==='function')target.focus();},0);
    }
    function dispatch(action,notice,focusSelector='[data-surface]'){screeningState=ScreeningMachine.transition(screeningState,action);renderScreening();focusAfterRender(focusSelector);if(notice)toast(notice);}
    function closeDrawer(){const returnTarget=lastDrawerTrigger||'[data-surface]';lastDrawerTrigger='';dispatch({type:'CLOSE_DRAWER'},'',returnTarget);}
    function runScreening(){
      let next=screeningState;
      for(let i=0;i<3;i+=1)next=ScreeningMachine.transition(next,{type:'ADVANCE'});
      next=ScreeningMachine.transition(next,{type:'VIEW_STAGE',index:2});
      screeningState=next;renderScreening();focusAfterRender();toast(screeningState.publish.status==='BLOCKED'?'安全检查已阻断筛选卡':'筛选卡已准备好');
    }
    function recoverProhibited(){
      let next=ScreeningMachine.transition(screeningState,{type:'RECOVER_PROHIBITED'});
      next=ScreeningMachine.transition(next,{type:'ADVANCE'});
      next=ScreeningMachine.transition(next,{type:'ADVANCE'});
      next=ScreeningMachine.transition(next,{type:'VIEW_STAGE',index:2});
      screeningState=next;renderScreening();focusAfterRender();toast('禁用信号已移除，筛选卡已重新生成');
    }
    function updateDecisionDraft(){
      const reason=document.querySelector('[data-role="decision-reason"]');if(reason)screeningState=ScreeningMachine.transition(screeningState,{type:'SET_REASON',value:reason.value});
      const revisit=document.querySelector('[data-role="revisit-at"]');if(revisit)screeningState=ScreeningMachine.transition(screeningState,{type:'SET_REVISIT',value:revisit.value});
      const button=document.querySelector('[data-action="submit-decision"]');if(button)button.disabled=!(screeningState.selection&&screeningState.reason.trim()&&(screeningState.selection!=='HOLD'||screeningState.revisitAt.trim()));
    }
    function bindScreening(){
      document.querySelectorAll('[data-stop-propagation]').forEach(el=>el.addEventListener('click',event=>event.stopPropagation()));
      document.querySelectorAll('[data-action]').forEach(el=>el.addEventListener('click',event=>{
        const action=el.dataset.action,index=Number(el.dataset.index||0);
        if(action==='run-screening')runScreening();
        if(action==='show-decision')dispatch({type:'VIEW_STAGE',index:3});
        if(action==='reset')dispatch({type:'RESET'},'已重置当前合成场景');
        if(action==='evidence'){lastDrawerTrigger=`[data-action="evidence"][data-index="${index}"]`;dispatch({type:'OPEN_EVIDENCE',index},'', '[role="dialog"] [data-action="close-drawer"]');}
        if(action==='versions'){lastDrawerTrigger='[data-action="versions"]';dispatch({type:'OPEN_VERSIONS'},'', '[role="dialog"] [data-action="close-drawer"]');}
        if(action==='close-drawer')closeDrawer();
        if(action==='recover-prohibited')recoverProhibited();
        if(action==='rebuild-version'){dispatch({type:'REBUILD_VERSION'},'已基于新材料生成当前筛选卡');}
        if(action==='repair-recipient'){dispatch({type:'REPAIR_RECIPIENT'},'通知对象已修复，仍使用原负责人任务');}
        if(action==='advance-reminder')dispatch({type:'ADVANCE_REMINDER'});
        if(action==='submit-decision'){updateDecisionDraft();dispatch({type:'SUBMIT_DECISION',actionId:`ui-decision-r${screeningState.request.revision}`},'负责人决定已留痕');}
        if(action==='reach-revisit')dispatch({type:'REACH_REVISIT'},'已恢复一张未选择的负责人任务');
        if(action==='attack-agent')dispatch({type:'SUBMIT_DECISION',decision:'INVITE',reason:'Agent 越权测试',actorType:'AGENT',actorId:'screening-worker',actionId:'attack-agent-1'});
        if(action==='attack-stale')dispatch({type:'SUBMIT_DECISION',decision:'INVITE',reason:'旧卡测试',requestRevision:0,actionId:'attack-stale-1'});
        if(action==='repeat-submit'){const last=screeningState.decisionHistory.at(-1);dispatch({type:'SUBMIT_DECISION',decision:last.decision,reason:last.reason,actionId:last.actionId},'重复动作只返回原回执');}
        if(event.currentTarget.classList.contains('backdrop'))event.stopPropagation();
      }));
      document.querySelectorAll('input[name="department-decision"]').forEach(el=>el.addEventListener('change',event=>dispatch({type:'SELECT_DECISION',value:event.target.value},'',`input[name="department-decision"][value="${event.target.value}"]`)));
      const reason=document.querySelector('[data-role="decision-reason"]');if(reason)reason.addEventListener('input',updateDecisionDraft);
      const revisit=document.querySelector('[data-role="revisit-at"]');if(revisit)revisit.addEventListener('input',updateDecisionDraft);
      const fixtureSelect=document.querySelector('[data-role="fixture"]');if(fixtureSelect)fixtureSelect.addEventListener('change',event=>{screeningState=ScreeningMachine.transition(screeningState,{type:'SWITCH_FIXTURE',value:event.target.value});const url=new URL(location.href);url.searchParams.set('scenario',event.target.value);try{history.replaceState(null,'',url.href)}catch(_){}renderScreening();toast('已切换合成场景');});
    }
    function toast(message){const el=document.getElementById('toast');el.textContent=message;el.classList.add('show');clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove('show'),1800);}
    addEventListener('keydown',event=>{if(event.key==='Escape'&&(screeningState.evidenceOpen||screeningState.versionsOpen))closeDrawer();});
    globalThis.__screeningDemoTest={Machine:ScreeningMachine,get state(){return screeningState;},setState(value){screeningState=value;renderScreening();},renderScreening,runScreening};
    renderScreening();
    if(new URL(location.href).searchParams.get('autoplay')==='1')setTimeout(()=>{runScreening();setTimeout(()=>dispatch({type:'VIEW_STAGE',index:3}),900);},420);
  </script>
</body>
</html>
