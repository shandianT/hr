<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>招聘 Agent · 简历收件到自动开案</title>
  <style>
    :root {
      --ink:#171a19; --muted:#68706b; --paper:#f3f1eb; --surface:#fff;
      --line:#d9ddd7; --line-strong:#bec5bd; --blue:#2458e6; --blue-soft:#eaf0ff;
      --green:#177754; --green-soft:#e7f4ee; --amber:#a75d15; --amber-soft:#fff0dc;
      --red:#af3c36; --red-soft:#fbeae8; --lime:#d9ff59; --shadow:0 20px 65px rgba(21,27,23,.12);
    }
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:var(--paper);color:var(--ink)}
    body{font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;font-size:14px;letter-spacing:-.01em}
    button,select,textarea{font:inherit} button{cursor:pointer}
    button:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid rgba(36,88,230,.24);outline-offset:2px}
    a{color:inherit}
    .mono{font-family:"SFMono-Regular",Consolas,monospace;letter-spacing:0}
    .small{font-size:12px;line-height:1.55;color:var(--muted)}
    .eyebrow{font-size:10px;font-weight:790;letter-spacing:.11em;text-transform:uppercase;color:var(--muted)}
    .strong{font-weight:740}
    .btn{min-height:38px;padding:8px 13px;border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--ink);font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:7px;text-decoration:none;transition:.16s ease}
    .btn:hover{transform:translateY(-1px);border-color:var(--line-strong);background:#f9faf7}
    .btn.primary{background:var(--ink);border-color:var(--ink);color:#fff}.btn.primary:hover{background:#2b302e}
    .btn.blue{background:var(--blue);border-color:var(--blue);color:#fff}.btn.blue:hover{background:#1747cb}
    .btn.tiny{min-height:31px;padding:5px 9px;font-size:12px}.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
    .pill{display:inline-flex;align-items:center;gap:6px;min-height:25px;padding:4px 8px;border:1px solid var(--line);border-radius:99px;background:#fff;color:var(--muted);font-size:11px;font-weight:730;white-space:nowrap}
    .pill.blue{color:var(--blue);border-color:#cbd8ff;background:var(--blue-soft)}
    .pill.good{color:var(--green);border-color:#c6e5d6;background:var(--green-soft)}
    .pill.warn{color:var(--amber);border-color:#efd4b0;background:var(--amber-soft)}
    .pill.danger{color:var(--red);border-color:#efc5c2;background:var(--red-soft)}
    .dot{width:7px;height:7px;border-radius:50%;background:currentColor}
    .top-note{min-height:34px;padding:7px 18px;border-bottom:1px solid #e8dfc4;background:#fff9e9;display:flex;align-items:center;gap:8px;font-size:12px;color:#6d6249}
    .top-note b{color:#302e28}
    .shell{min-height:calc(100vh - 34px);display:grid;grid-template-rows:auto auto 1fr auto}
    .topbar{height:68px;padding:0 22px;background:#fff;border-bottom:1px solid var(--line);display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:16px}
    .brand{display:flex;align-items:center;gap:11px}.brand-mark{width:32px;height:32px;border-radius:9px;background:var(--ink);color:var(--lime);display:grid;place-items:center;font-weight:880}.brand-title{font-size:14px;font-weight:790}.brand-sub{font-size:10px;color:#89908b;margin-top:2px}
    .top-center{text-align:center}.top-center b{display:block;font-size:13px}.top-center span{font-size:11px;color:var(--muted)}
    .top-actions{display:flex;align-items:center;justify-content:flex-end;gap:8px}
    .intro{padding:18px 24px 16px;background:#faf9f5;border-bottom:1px solid var(--line);display:flex;align-items:flex-end;justify-content:space-between;gap:24px}
    .intro h1{max-width:760px;margin:5px 0 5px;font-size:clamp(25px,3vw,39px);line-height:1.05;letter-spacing:-.055em;font-weight:760}
    .intro p{margin:0;max-width:760px;color:#59605c;line-height:1.55}
    .demo-picker{min-width:320px}.demo-picker label{display:block;margin-bottom:6px}.select{width:100%;height:42px;padding:0 34px 0 12px;border:1px solid var(--line-strong);border-radius:9px;background:#fff;color:var(--ink)}
    .gates{display:grid;grid-template-columns:repeat(5,1fr);border-bottom:1px solid var(--line);background:#fff}
    .gate{position:relative;min-height:74px;padding:13px 14px;border:0;border-right:1px solid var(--line);background:#fff;text-align:left;color:var(--muted)}
    .gate:last-child{border-right:0}.gate:hover{background:#fafbf8}.gate:disabled{cursor:default}
    .gate-no{font-size:10px;font-family:monospace;color:#929993}.gate-label{display:block;margin-top:8px;font-size:12px;font-weight:740;color:inherit}
    .gate.done{color:var(--green);background:#f4faf6}.gate.done::after,.gate.current::after,.gate.blocked::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:currentColor}
    .gate.current{color:var(--blue);background:var(--blue-soft)}.gate.blocked{color:var(--red);background:var(--red-soft)}
    .workspace{min-height:0;display:grid;grid-template-columns:280px minmax(520px,1fr) 300px}
    .source{padding:18px;border-right:1px solid var(--line);background:#f0f0ec;overflow:auto}.source h2,.activity h2{font-size:16px;margin:5px 0 12px}
    .file-card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:15px;box-shadow:0 8px 25px rgba(31,37,33,.05)}
    .file-icon{width:42px;height:50px;border:1px solid #d4d8d2;background:#f6f7f3;display:grid;place-items:center;font-size:11px;font-weight:800;margin-bottom:12px}
    .file-name{font-weight:740;line-height:1.35;word-break:break-word}.file-meta{display:grid;grid-template-columns:82px 1fr;gap:8px;margin-top:14px;padding-top:12px;border-top:1px solid var(--line);font-size:11px}.file-meta span:nth-child(odd){color:var(--muted)}
    .resume-preview{margin-top:14px;padding:15px;background:#fff;border:1px solid var(--line);border-radius:12px}.resume-line{height:6px;border-radius:6px;background:#e4e7e1;margin:8px 0}.resume-line.dark{width:52%;height:10px;background:#bfc5bf}.resume-line.short{width:65%}.resume-line.tiny{width:38%}
    .source-note{margin-top:13px;padding:12px;border-left:3px solid var(--blue);background:#eaf0ff;color:#46546d;font-size:11px;line-height:1.55}
    .main{padding:20px 22px 90px;overflow:auto;background:var(--paper)}
    .panel-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:16px}.panel-head h2{font-size:23px;margin:5px 0 3px;letter-spacing:-.04em}.panel-actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
    .card{background:#fff;border:1px solid var(--line);border-radius:13px}.stage-card{overflow:hidden}.stage-title{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px}.stage-body{padding:18px}
    .lead{font-size:18px;line-height:1.4;letter-spacing:-.025em;font-weight:700}.subtle{color:var(--muted);line-height:1.55;margin-top:6px}
    .checks{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:17px}.check{padding:12px;border:1px solid var(--line);border-radius:10px}.check-top{display:flex;align-items:center;justify-content:space-between;gap:8px}.check b{font-size:12px}.check p{margin:7px 0 0;font-size:11px;color:var(--muted);line-height:1.5}
    .field-table{margin-top:14px;border-top:1px solid var(--line)}.field-row{display:grid;grid-template-columns:130px minmax(100px,1fr) 170px 90px;gap:10px;align-items:center;padding:11px 3px;border-bottom:1px solid #ecefe9;font-size:12px}.field-row.header{color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.07em}.field-row button{border:0;background:none;color:var(--blue);padding:0;text-align:left;font-weight:680}.unknown{color:var(--amber)}
    .notice{margin-top:14px;padding:13px 14px;border-radius:10px;border:1px solid #efd4b0;background:var(--amber-soft);color:#754718;line-height:1.55}.notice.danger{border-color:#efc5c2;background:var(--red-soft);color:#7b312d}.notice.good{border-color:#c6e5d6;background:var(--green-soft);color:#225f49}
    .route{display:grid;grid-template-columns:1fr 34px 1.3fr 34px 1fr;align-items:stretch;margin-top:18px}.route-node{padding:14px;border:1px solid var(--line);background:#fbfcf9;border-radius:10px}.route-node b{display:block;margin:6px 0;font-size:13px}.route-arrow{display:grid;place-items:center;color:#8c948e}.route-basis{margin-top:14px;padding:12px;background:#f5f6f2;border-radius:9px;font-size:11px;color:var(--muted);line-height:1.55}
    .candidate-list{display:grid;gap:9px;margin-top:15px}.candidate-option{display:flex;align-items:center;gap:10px;padding:12px;border:1px solid var(--line);border-radius:10px;background:#fff}.candidate-option input{accent-color:var(--blue)}.candidate-option span{margin-left:auto;font-size:11px;color:var(--muted)}
    textarea{width:100%;min-height:72px;margin-top:12px;padding:10px;border:1px solid var(--line-strong);border-radius:9px;resize:vertical;background:#fff;color:var(--ink)}
    .human-card{margin-top:15px;padding:15px;border:1px solid #e5c28d;background:#fff9ec;border-radius:12px}.human-card h3{margin:6px 0;font-size:16px}.human-actions{display:flex;align-items:center;gap:8px;margin-top:12px}
    .receipt{display:grid;grid-template-columns:1.3fr .7fr;gap:20px}.receipt-id{font-size:27px;letter-spacing:-.04em;font-weight:780;margin:8px 0}.receipt-list{display:grid;gap:9px}.receipt-row{display:flex;justify-content:space-between;gap:16px;padding-bottom:9px;border-bottom:1px solid #ecefe9;font-size:12px}.receipt-row span{color:var(--muted)}
    .activity{padding:18px;border-left:1px solid var(--line);background:#fff;overflow:auto}.activity-status{padding:13px;border:1px solid var(--line);border-radius:10px;background:#f7f8f5}.activity-status b{display:block;margin-top:5px}.activity-list{margin-top:18px}.activity-item{position:relative;padding:0 0 18px 20px;color:#3f4541;font-size:12px;line-height:1.45}.activity-item::before{content:"";position:absolute;left:0;top:4px;width:7px;height:7px;border-radius:50%;background:#bac1bb}.activity-item::after{content:"";position:absolute;left:3px;top:13px;bottom:2px;width:1px;background:#dfe3de}.activity-item:last-child::after{display:none}.activity-item.current::before{background:var(--blue);box-shadow:0 0 0 4px var(--blue-soft)}.activity-item.done::before{background:var(--green)}.activity-time{font-size:10px;color:#989e99;margin-top:3px}
    .truth{margin-top:16px;padding-top:15px;border-top:1px solid var(--line)}.truth-row{display:flex;justify-content:space-between;gap:12px;padding:7px 0;font-size:11px}.truth-row span:first-child{color:var(--muted)}
    .footer{position:fixed;z-index:20;left:280px;right:300px;bottom:0;min-height:58px;padding:10px 22px;border-top:1px solid var(--line);background:rgba(255,255,255,.94);backdrop-filter:blur(12px);display:flex;align-items:center;justify-content:space-between;gap:18px}.checkpoint{display:flex;align-items:center;gap:14px;min-width:0}.checkpoint b{font-size:11px}.checkpoint span{font-size:11px;color:var(--muted)}
    .evidence-backdrop{position:fixed;z-index:60;inset:0;background:rgba(16,19,18,.45);display:flex;justify-content:flex-end}.evidence-drawer{width:min(520px,100%);height:100%;background:#fff;box-shadow:-20px 0 60px rgba(0,0,0,.18);padding:22px;overflow:auto}.drawer-top{display:flex;align-items:center;justify-content:space-between}.quote{margin-top:18px;padding:18px;border-left:3px solid var(--blue);background:#f4f6fb;font-size:16px;line-height:1.65}.locator{margin-top:14px;display:grid;grid-template-columns:120px 1fr;gap:8px;padding:13px;background:#f5f6f2;font-size:12px}.toast{position:fixed;z-index:90;right:20px;top:20px;padding:12px 15px;border-radius:10px;background:#171a19;color:#fff;box-shadow:var(--shadow);opacity:0;transform:translateY(-8px);pointer-events:none;transition:.2s}.toast.show{opacity:1;transform:none}
    @media(max-width:1120px){.intro{display:grid;grid-template-columns:minmax(0,1fr) minmax(260px,320px);align-items:end}.intro h1{font-size:32px}.demo-picker{min-width:0}.workspace{grid-template-columns:240px minmax(0,1fr)}.activity{grid-column:1/-1;border-left:0;border-top:1px solid var(--line);max-height:none}.footer{left:240px;right:0}.activity-list{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.activity-item{padding-bottom:4px}.activity-item::after{display:none}}
    @media(max-width:760px){.top-note{padding:8px 12px;align-items:flex-start}.topbar{height:auto;min-height:62px;padding:10px 12px;grid-template-columns:1fr auto}.top-center{display:none}.brand-sub{display:none}.top-actions .pill{display:none}.intro{padding:18px 14px;display:block}.intro h1{font-size:29px;max-width:12em}.demo-picker{min-width:0;margin-top:16px}.gates{overflow-x:auto;grid-template-columns:repeat(5,150px);position:sticky;top:0;z-index:12}.gate{min-height:66px}.workspace{display:block}.source{border-right:0;border-bottom:1px solid var(--line);padding:14px}.resume-preview,.source-note{display:none}.file-card{display:grid;grid-template-columns:48px 1fr;gap:10px}.file-icon{margin:0}.file-meta{grid-column:1/-1}.main{padding:16px 14px 100px}.panel-head{display:block}.panel-actions{margin-top:12px;justify-content:flex-start}.checks{grid-template-columns:1fr}.field-row{grid-template-columns:90px 1fr 82px}.field-row>*:nth-child(3){display:none}.route{grid-template-columns:1fr;gap:8px}.route-arrow{transform:rotate(90deg)}.receipt{grid-template-columns:1fr}.activity{padding:16px 14px 90px}.activity-list{display:block}.footer{left:0;right:0;padding:9px 12px}.checkpoint span{display:none}.evidence-drawer{width:100%}}
  </style>
</head>
<body>
  <div id="app"></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script>
    const gates = [
      { label:'接收与安全', checkpoint:'INTAKE/RECEIVE/1' },
      { label:'解析与证据', checkpoint:'INTAKE/PARSE/1' },
      { label:'去重与身份', checkpoint:'INTAKE/IDENTITY/1' },
      { label:'岗位与批次', checkpoint:'INTAKE/ROUTING/1' },
      { label:'自动开案', checkpoint:'INTAKE/COMMIT/1' }
    ];
    const scenarios = {
      normal:{ label:'正常简历 · 自动开案', file:'林可欣_AI产品经理_合成简历.pdf', source:'批准招聘邮箱', hash:'9f2c…81aa', terminal:-1, kind:'normal' },
      duplicate:{ label:'邮件 + ATS 重复到达', file:'FWD_林可欣_AI产品经理.pdf', source:'ATS 回调（第二来源）', hash:'9f2c…81aa', terminal:2, kind:'duplicate' },
      encrypted:{ label:'加密附件 · 安全阻断', file:'候选人资料_加密.zip', source:'批准招聘邮箱', hash:'71de…02bc', terminal:0, kind:'encrypted' },
      injection:{ label:'简历内提示注入', file:'王浩_增长产品经理.pdf', source:'批准招聘邮箱', hash:'b6a1…17f4', terminal:-1, kind:'injection' },
      identity:{ label:'共享联系方式 · 身份冲突', file:'陈晨_共享联系方式.pdf', source:'批准招聘邮箱', hash:'c3e7…55a9', terminal:2, kind:'identity' },
      routing:{ label:'岗位 / 批次不唯一', file:'李然_产品岗位.pdf', source:'员工内推 ATS', hash:'d8f0…24c1', terminal:3, kind:'routing' }
    };
    const initialScenario = new URL(location.href).searchParams.get('scenario');
    const state = {
      scenario: scenarios[initialScenario] ? initialScenario : 'normal',
      step:0, view:0, started:false, resolved:false, committed:false, auto:false, timer:null,
      selection:'', reason:'', evidenceOpen:false, evidenceField:0, decisionReceipt:null, decisionHistory:[], needsInfo:false
    };

    function scenario(){ return scenarios[state.scenario]; }
    function isTerminal(){ return state.started && !state.resolved && scenario().terminal === state.step; }
    function isComplete(){ return state.committed || (state.scenario === 'duplicate' && isTerminal()); }
    function status(){
      if(state.committed) return {label:'案件已创建',cls:'good'};
      if(state.scenario==='duplicate'&&isTerminal()) return {label:'已附加重复来源',cls:'good'};
      if(isTerminal()) return {label:state.scenario==='encrypted'?'安全门已阻断':'等待必要人工判断',cls:state.scenario==='encrypted'?'danger':'warn'};
      if(!state.started) return {label:'等待演示输入',cls:'blue'};
      return {label:'Agent 自动处理中',cls:'blue'};
    }
    function completionToastMessage(){
      if(state.scenario==='duplicate'&&isTerminal())return '重复来源已附加，没有创建第二案件';
      return isTerminal()?'已在安全边界停止':'案件已自动创建';
    }
    function personData(){
      if(state.scenario==='injection')return {id:'P-02314',name:'王浩',city:'深圳',years:'6 年',specialty:'增长产品经历',specialtyValue:'4 年',workEvidence:'“2020.07—至今，累计 6 年产品工作经验，历任产品经理与高级产品经理。”',specialtyEvidence:'“2022.07—至今，连续 4 年负责增长产品，覆盖漏斗设计、实验与发布复盘。”'};
      if(state.scenario==='identity'){
        const base={name:'陈晨',city:'上海',years:'5 年',specialty:'数据产品经历',specialtyValue:'3 年',workEvidence:'“2021.07—至今，累计 5 年产品工作经验，历任产品经理与高级产品经理。”',specialtyEvidence:'“2023.07—至今，连续 3 年负责数据产品，覆盖指标口径、数据治理与发布复盘。”'};
        if(state.selection==='candidate-chen-2')return {id:'P-05591',...base};
        if(state.selection==='candidate-new')return {id:'P-NEW-24122',...base};
        return {id:state.resolved?'P-04211':'待人工确认',...base};
      }
      if(state.scenario==='routing')return {id:'P-03621',name:'李然',city:'杭州',years:'8 年',specialty:'平台产品经历',specialtyValue:'5 年',workEvidence:'“2018.07—至今，累计 8 年产品工作经验，历任产品经理与高级产品经理。”',specialtyEvidence:'“2021.07—至今，连续 5 年负责平台产品，覆盖权限、工作流与发布复盘。”'};
      return {id:'P-01827',name:'林可欣',city:'上海',years:'7 年',specialty:'AI 产品经历',specialtyValue:'3 年',workEvidence:'“2019.07—至今，累计 7 年产品工作经验，历任产品经理与高级产品经理。”',specialtyEvidence:'“2023.07—至今，连续 3 年负责 AI 产品，覆盖需求验证、评测集设计与灰度发布。”'};
    }
    function routeData(){
      if(state.scenario==='injection')return {req:'REQ-GPM-1182',job:'增长产品经理',cycle:'RC-2026Q3-SZ',cycleLabel:'深圳 · ACTIVE'};
      if(state.scenario==='identity')return {req:'REQ-DPM-1022',job:'数据产品经理',cycle:'RC-2026Q3-SH',cycleLabel:'上海 · ACTIVE'};
      if(state.scenario==='routing'&&state.selection==='route-growth')return {req:'REQ-GPM-1182',job:'增长产品经理',cycle:'RC-2026Q3-HZ',cycleLabel:'杭州 · ACTIVE'};
      if(state.scenario==='routing')return {req:'REQ-AIPM-2403',job:'AI 产品经理',cycle:'RC-2026Q3-HZ',cycleLabel:'杭州 · ACTIVE'};
      return {req:'REQ-AIPM-2403',job:'AI 产品经理',cycle:'RC-2026Q3-SH',cycleLabel:'上海 · ACTIVE'};
    }
    function caseData(){
      return {normal:'AP-24081',duplicate:'AP-24081',encrypted:'—',injection:'AP-24107',identity:'AP-24122',routing:'AP-24131'}[state.scenario];
    }
    function submissionData(){return {normal:'IN-24081',duplicate:'IN-24081',encrypted:'IN-24103',injection:'IN-24107',identity:'IN-24122',routing:'IN-24131'}[state.scenario];}
    function receiptHistory(){
      const history=Array.isArray(state.decisionHistory)?state.decisionHistory.filter(Boolean):[];
      return history.length?history:(state.decisionReceipt?[state.decisionReceipt]:[]);
    }
    function routingRevision(){return state.scenario==='routing'&&receiptHistory().some(receipt=>receipt.kind==='ROUTING_RESOLUTION')?2:1;}
    function selectionLabel(value){return {['candidate-chen-1']:'P-04211 · 陈晨',['candidate-chen-2']:'P-05591 · 陈晨（同名）',['candidate-new']:'创建新身份 P-NEW-24122',['route-ai']:'REQ-AIPM-2403 · RC-2026Q3-HZ',['route-growth']:'REQ-GPM-1182 · RC-2026Q3-HZ',['route-more']:'需要补充信息'}[value]||value;}
    function decisionHistoryView(){
      return receiptHistory().map(receipt=>{
        const isInfoRequest=receipt.kind==='ROUTING_INFO_REQUEST';
        const revisionLabel=receipt.revisionLabel||(state.scenario==='identity'?'Identity Resolution Revision 2':`Routing Revision ${routingRevision()}`);
        const checkpoint=receipt.checkpoint||`INTAKE/${state.scenario==='identity'?'IDENTITY':'ROUTING'}/REV-2`;
        return `<div class="notice ${isInfoRequest?'':'good'}"><b>${isInfoRequest?'补充信息回执':'人工判断回执'}</b><br>${receipt.actor||'当前授权人'} · ${selectionLabel(receipt.selection)} · ${revisionLabel}<br><span class="mono">检查点 ${checkpoint}</span><br>依据：${receipt.reason}</div>`;
      }).join('');
    }
    function scenarioOptions(){ return Object.entries(scenarios).map(([key,item])=>`<option value="${key}" ${key===state.scenario?'selected':''}>${item.label}</option>`).join(''); }

        state.needsInfo=true;toast('补充信息任务已记录；案件仍未创建');renderIntake();return;
      }
      const identityResolution=state.scenario==='identity';
      state.resolved=true; state.decisionReceipt={kind:identityResolution?'IDENTITY_RESOLUTION':'ROUTING_RESOLUTION',actor:identityResolution?'林敏 / 招聘运营（身份复核）':'林敏 / 招聘运营（路由复核）',selection:state.selection,reason:state.reason.trim(),checkpoint:`INTAKE/${identityResolution?'IDENTITY':'ROUTING'}/REV-2`,revisionLabel:identityResolution?'Identity Resolution Revision 2':'Routing Revision 2'};
      state.decisionHistory=[...receiptHistory().filter(receipt=>receipt!==state.decisionReceipt),state.decisionReceipt];
      state.step=state.scenario==='identity'?3:4; state.view=state.step;
      if(state.step===4){state.committed=true;toast('人工判断已留痕，案件已自动创建');renderIntake();return;}
      toast('人工判断已留痕，Agent 正在从检查点继续'); renderIntake();
      setTimeout(()=>{
        if(state.scenario==='identity'&&state.resolved&&!state.committed){
          state.step=4;state.view=4;state.committed=true;renderIntake();toast(`案件 ${caseData()} 已自动创建`);
        }
      },750);
    }
    function resumeDecision(){state.needsInfo=false;state.selection='';state.reason='';state.decisionReceipt=null;renderIntake();}
    function switchScenario(value){
      stopAuto(); state.scenario=value; state.step=0;state.view=0;state.started=false;state.resolved=false;state.committed=false;state.selection='';state.reason='';state.decisionReceipt=null;state.decisionHistory=[];state.evidenceOpen=false;state.evidenceField=0;state.needsInfo=false;
      const url=new URL(location.href);url.searchParams.set('scenario',value);try{history.replaceState(null,'',url.href)}catch(_){}
      renderIntake(); toast('已切换合成来信');
    }
    function bind(){
      document.querySelectorAll('[data-action]').forEach(el=>el.addEventListener('click',e=>{
        const action=el.dataset.action;
        if(action==='next')advance();
        if(action==='auto-run')autoRun();
        if(action==='reset')reset();
        if(action==='inspect-field'){state.evidenceField=Number(el.dataset.field||0);state.evidenceOpen=true;renderIntake();}
        if(action==='close-evidence'){state.evidenceOpen=false;renderIntake();}
        if(action==='submit-human')submitHumanDecision();
        if(action==='resume-decision')resumeDecision();
      }));
      document.querySelectorAll('[data-inspect]').forEach(el=>el.addEventListener('click',()=>{state.view=Number(el.dataset.inspect);renderIntake();}));
      const scenarioSelect=document.querySelector('[data-role="scenario"]'); if(scenarioSelect)scenarioSelect.addEventListener('change',e=>switchScenario(e.target.value));
      const updateDecisionButton=()=>{const button=document.querySelector('[data-action="submit-human"]');if(button)button.disabled=!(state.selection&&state.reason.trim());};
      document.querySelectorAll('input[name="human-choice"]').forEach(el=>el.addEventListener('change',e=>{state.selection=e.target.value;updateDecisionButton();}));
      const reason=document.querySelector('[data-role="decision-reason"]'); if(reason)reason.addEventListener('input',e=>{state.reason=e.target.value;updateDecisionButton();});
    }
    function toast(message){const el=document.getElementById('toast');el.textContent=message;el.classList.add('show');clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove('show'),1900);}
    addEventListener('keydown',e=>{if(e.key==='Escape'&&state.evidenceOpen){state.evidenceOpen=false;renderIntake();}});
    globalThis.__intakeDemoTest={state,personData,routeData,caseData,fieldRows,selectionLabel,isComplete,gateClass,completionToastMessage,commitView,evidenceDrawer,routingView,activityItems,submitHumanDecision,resumeDecision,renderIntake};
    renderIntake();
    if(new URL(location.href).searchParams.get('autoplay')==='1')setTimeout(autoRun,450);
  </script>
</body>
</html>
