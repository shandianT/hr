<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>招聘 Agent · 候选人约面 Demo</title>
  <style>
    :root{
      --paper:#f5f5f1;--surface:#fff;--ink:#19201b;--muted:#69716b;--line:#dfe3dc;--line-strong:#b9c0b9;
      --soft:#f1f3ef;--blue:#2856d9;--blue-soft:#edf2ff;--green:#237449;--green-soft:#eaf6ef;
      --amber:#976318;--amber-soft:#fff5e5;--red:#a13a34;--red-soft:#fff0ef;--shadow:0 22px 70px rgba(35,45,38,.08)
    }
    *{box-sizing:border-box}
    html{background:var(--paper);color:var(--ink)}
    body{margin:0;min-height:100vh;font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;font-size:14px;letter-spacing:-.012em}
    button,select,input{font:inherit;color:inherit}
    button,select,summary,a,label{touch-action:manipulation}
    button{cursor:pointer}
    h1,h2,h3,p{margin-top:0}
    a{color:inherit}
    .mono{font-family:"SFMono-Regular",Consolas,monospace;letter-spacing:0}
    .demo-note{min-height:38px;padding:8px 18px;background:#1f2822;color:#f6f7f4;display:flex;justify-content:center;align-items:center;gap:10px;font-size:12px}
    .demo-note span{color:#bdc7bf}
    .shell{width:min(1040px,100%);margin:0 auto;padding:0 24px 56px}
    .topbar{min-height:74px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line)}
    .brand{display:flex;align-items:center;gap:11px;font-weight:820}
    .brand-mark{width:32px;height:32px;border-radius:10px;background:var(--ink);color:#fff;display:grid;place-items:center}
    .brand-copy span{display:block;font-size:10px;color:var(--muted);font-weight:600;margin-top:2px}
    .back-link{font-size:12px;color:var(--muted);text-decoration:none}
    .page-head{padding:30px 0 22px}
    .kicker,.eyebrow{font-size:10px;color:var(--blue);font-weight:820;letter-spacing:.11em;text-transform:uppercase}
    .page-head h1{font-size:38px;line-height:1.05;letter-spacing:-.05em;margin:8px 0 10px}
    .page-head p{max-width:680px;color:var(--muted);font-size:15px;line-height:1.7;margin:0}
    .stepper{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:18px}
    .step{display:grid;grid-template-columns:30px 1fr;gap:10px;align-items:center;padding:13px 14px;border:1px solid var(--line);border-radius:13px;background:rgba(255,255,255,.66);color:var(--muted)}
    .step-no{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:#eef0ec;font-size:12px;font-weight:820}
    .step b{display:block;font-size:13px}.step span:last-child{display:block;font-size:11px;margin-top:3px}
    .step.active{border-color:#b8c7f7;background:var(--blue-soft);color:var(--blue)}
    .step.active .step-no{background:var(--blue);color:#fff}
    .step.done{color:var(--green)}.step.done .step-no{background:var(--green-soft);color:var(--green)}
    .surface{background:var(--surface);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);overflow:hidden}
    .surface-head{padding:22px 24px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:18px;align-items:flex-start}
    .surface-head h2{font-size:24px;letter-spacing:-.035em;margin:5px 0 7px}
    .surface-head p{color:var(--muted);line-height:1.55;margin:0;max-width:640px}
    .surface-body{padding:24px}
    .pill{display:inline-flex;align-items:center;gap:7px;padding:7px 10px;border:1px solid var(--line);border-radius:999px;background:#fff;color:var(--muted);font-size:11px;font-weight:760;white-space:nowrap}
    .pill.blue{color:var(--blue);background:var(--blue-soft);border-color:#d4defd}
    .pill.good{color:var(--green);background:var(--green-soft);border-color:#cce7d7}
    .pill.warn{color:var(--amber);background:var(--amber-soft);border-color:#efd8b8}
    .pill.danger{color:var(--red);background:var(--red-soft);border-color:#edcbc8}
    .dot{width:6px;height:6px;border-radius:50%;background:currentColor}
    .btn{min-height:42px;padding:9px 15px;border:1px solid var(--line-strong);border-radius:11px;background:#fff;font-weight:760;display:inline-flex;justify-content:center;align-items:center;gap:7px;text-decoration:none}
    .btn:hover{border-color:#8f9991}.btn:disabled{opacity:.42;cursor:not-allowed}
    .btn:focus-visible,.slot:focus-within,.record-choice:focus-within,summary:focus-visible,select:focus-visible{outline:3px solid rgba(40,86,217,.22);outline-offset:2px}
    .btn.primary{color:#fff;background:var(--blue);border-color:var(--blue);box-shadow:0 8px 22px rgba(40,86,217,.2)}
    .btn.secondary{background:var(--soft)}.btn.tiny{min-height:34px;padding:6px 10px;font-size:12px}
    .text-action{border:0;background:transparent;color:var(--blue);padding:8px 2px;font-weight:720}
    .small{font-size:12px;color:var(--muted);line-height:1.55}
    .meeting-card{display:grid;grid-template-columns:1.25fr repeat(3,1fr);gap:1px;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--line);margin-bottom:18px}
    .meeting-fact{background:var(--soft);padding:14px}.meeting-fact span{display:block;color:var(--muted);font-size:10px;margin-bottom:5px}.meeting-fact b{font-size:13px}
    .slot-list{display:grid;gap:10px}
    .slot{display:grid;grid-template-columns:24px 1fr auto;gap:12px;align-items:center;padding:15px;border:1px solid var(--line);border-radius:14px;background:#fff;cursor:pointer}
    .slot:hover{border-color:#aab4ab}.slot.selected{border-color:#8fa6ef;background:var(--blue-soft)}
    .slot input,.record-choice input{width:18px;height:18px;margin:0;accent-color:var(--blue)}
    .slot b{display:block;font-size:15px;margin-bottom:4px}.slot span{color:var(--muted);font-size:12px}.slot em{font-style:normal;font-size:11px;color:var(--blue);font-weight:760}
    .primary-row{display:flex;justify-content:flex-end;align-items:center;gap:12px;margin-top:20px}.primary-row .small{max-width:540px;margin-right:auto}
    .callout{padding:14px 15px;border:1px solid var(--line);border-radius:12px;background:var(--soft);line-height:1.6;margin:14px 0}
    .callout.blue{background:var(--blue-soft);border-color:#d4defd}.callout.warn{background:var(--amber-soft);border-color:#efd8b8}.callout.danger{background:var(--red-soft);border-color:#edcbc8}.callout.good{background:var(--green-soft);border-color:#cce7d7}
    .confirm-hero,.receipt-hero{text-align:center;padding:8px 0 18px}
    .confirm-mark,.receipt-mark{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;margin:0 auto 12px;font-size:22px;font-weight:900}
    .confirm-mark{background:var(--blue-soft);color:var(--blue)}.receipt-mark{background:var(--green-soft);color:var(--green)}
    .confirm-hero h2,.receipt-hero h2{font-size:28px;letter-spacing:-.04em;margin-bottom:7px}
    .confirm-hero p,.receipt-hero p{color:var(--muted);line-height:1.6;max-width:650px;margin:0 auto}
    .selected-time{padding:16px;border:1px solid var(--line);border-radius:13px;background:var(--soft);display:flex;justify-content:space-between;gap:14px;align-items:center;margin-bottom:14px}
    .selected-time span{display:block;color:var(--muted);font-size:11px;margin-bottom:5px}.selected-time b{font-size:16px}
    .receipt-list{display:grid;gap:8px}.receipt-row{display:flex;justify-content:space-between;gap:14px;padding:12px 13px;border:1px solid var(--line);border-radius:11px}.receipt-row span{color:var(--muted)}
    .booking-card{padding:18px;border:1px solid #cce7d7;border-radius:14px;background:var(--green-soft);display:grid;grid-template-columns:1.5fr repeat(2,1fr);gap:16px}
    .booking-card span{display:block;color:#557060;font-size:10px;margin-bottom:5px}.booking-card b{font-size:14px}.booking-card .time b{font-size:19px;letter-spacing:-.025em}
    .recording-status{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}
    .recording-line{padding:14px;border:1px solid var(--line);border-radius:12px;background:var(--soft)}
    .recording-line span{display:block;color:var(--muted);font-size:10px;margin-bottom:5px}.recording-line b{font-size:13px}
    details.recording-panel,details.fold,details.test-panel{border:1px solid var(--line);border-radius:14px;background:rgba(255,255,255,.75);overflow:hidden}
    details.recording-panel{margin-top:10px}
    details>summary{list-style:none;padding:15px 17px;cursor:pointer;font-weight:780;display:flex;justify-content:space-between;align-items:center;gap:12px}
    details>summary::-webkit-details-marker{display:none}details>summary::after{content:"＋";font-size:18px;color:var(--muted);font-weight:400}details[open]>summary::after{content:"−"}
    details>summary span{font-size:11px;color:var(--muted);font-weight:500}
    .fold-body,.recording-body,.test-body{padding:0 17px 17px;border-top:1px solid var(--line)}
    .notice-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}
    .notice-item{padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--soft)}.notice-item span{display:block;font-size:10px;color:var(--muted);margin-bottom:4px}.notice-item b{font-size:12px}
    .record-choices{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .record-choice{display:grid;grid-template-columns:20px 1fr;gap:10px;padding:14px;border:1px solid var(--line);border-radius:12px;cursor:pointer}
    .record-choice.selected{border-color:#8fa6ef;background:var(--blue-soft)}.record-choice b{display:block;margin-bottom:4px}.record-choice span{font-size:11px;color:var(--muted);line-height:1.5}
    .folds{display:grid;gap:10px;margin-top:14px}
    .runtime-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
    .runtime-card{padding:13px;border:1px solid var(--line);border-radius:11px;background:var(--paper)}.runtime-card h3{font-size:12px;margin-bottom:9px}
    .runtime-row{display:flex;justify-content:space-between;gap:10px;margin-top:7px;font-size:11px}.runtime-row span{color:var(--muted)}.runtime-row b{text-align:right}
    .activity-list{margin-top:12px;border-top:1px solid var(--line)}.activity-item{display:grid;grid-template-columns:8px 1fr auto;gap:10px;align-items:start;padding:10px 0;border-bottom:1px solid var(--line);font-size:11px}.activity-dot{width:7px;height:7px;border-radius:50%;background:var(--blue);margin-top:4px}.activity-time{color:var(--muted)}
    .test-grid{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:end;margin-top:14px}.field label{display:block;font-size:11px;color:var(--muted);margin-bottom:6px}.field select{width:100%;height:42px;border:1px solid var(--line-strong);border-radius:10px;background:#fff;padding:0 10px}
    .toast{position:fixed;z-index:100;right:20px;top:20px;padding:12px 15px;border-radius:10px;background:var(--ink);color:#fff;box-shadow:var(--shadow);opacity:0;transform:translateY(-8px);pointer-events:none;transition:.2s}.toast.show{opacity:1;transform:none}
    @media(max-width:720px){
      .demo-note{padding:8px 12px;align-items:flex-start}.shell{padding:0 14px 48px}.topbar{min-height:62px}.brand-copy span,.back-link{display:none}
      .page-head{padding:22px 2px 17px}.page-head h1{font-size:31px}.page-head p{font-size:13px}.stepper{gap:6px}.step{display:block;padding:9px;text-align:center}.step-no{margin:0 auto 6px}.step>span:last-child>span{display:none}.step b{font-size:11px}
      .surface{border-radius:16px}.surface-head{padding:18px;display:block}.surface-head>.pill{margin-top:10px}.surface-head h2{font-size:21px}.surface-body{padding:17px}
      .meeting-card,.booking-card{grid-template-columns:1fr}.slot{grid-template-columns:22px 1fr}.slot em{display:none}.primary-row{display:block}.primary-row .btn{width:100%;margin-top:10px}.primary-row .text-action{width:100%}
      .recording-status,.record-choices,.notice-grid,.runtime-grid{grid-template-columns:1fr}.selected-time{display:block}.selected-time .pill{margin-top:10px}.test-grid{grid-template-columns:1fr}.test-grid .btn{width:100%}details.fold>summary span,details.test-panel>summary span{display:none}
      .toast{left:14px;right:14px;top:14px;text-align:center}
    }
    @media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
  </style>
</head>
<body>
  <div id="app"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script>
    const SchedulingMachine=(()=>{
      const clone=value=>JSON.parse(JSON.stringify(value));
      const DEFAULT_SLOTS=[
        {id:"slot-1",date:"8 月 14 日 · 周五",time:"14:00–14:45",zone:"新加坡时间（UTC+8）"},
        {id:"slot-2",date:"8 月 17 日 · 周一",time:"10:30–11:15",zone:"新加坡时间（UTC+8）"},
        {id:"slot-3",date:"8 月 18 日 · 周二",time:"16:00–16:45",zone:"新加坡时间（UTC+8）"}
      ];
      const REPLACEMENT_SLOTS=[
        {id:"slot-4",date:"8 月 19 日 · 周三",time:"11:00–11:45",zone:"新加坡时间（UTC+8）"},
        {id:"slot-5",date:"8 月 20 日 · 周四",time:"15:30–16:15",zone:"新加坡时间（UTC+8）"},
        {id:"slot-6",date:"8 月 21 日 · 周五",time:"09:30–10:15",zone:"新加坡时间（UTC+8）"}
      ];
      const FIXTURES={
        normal:{label:"默认体验",description:"候选人选时后进入确认中，三项合成回执齐全才显示面试已安排。",danger:false},
        expiredProposal:{label:"旧提案已过期",description:"候选人提交了刚过期的时段提案；旧选择被拒绝并刷新时段。",danger:true},
        slotConflict:{label:"选中后时段冲突",description:"提交前忙闲发生变化；不建会，返回新的可选时间。",danger:true},
        partialSuccess:{label:"日历成功、会议失败",description:"只有部分外部写入成功；保持确认中并交由有限重试与对账。",danger:true},
        lostResponse:{label:"外部成功但响应丢失",description:"会议可能已存在但没有当前回执；先对账，不重复创建。",danger:true},
        concurrentClaim:{label:"并发抢占同一时段",description:"另一个案件先取得时段；本案件重新提案，不产生双重预定。",danger:true},
        reschedule:{label:"改期中，旧安排仍有效",description:"新时间确认完成前，原面试安排始终保持当前有效。",danger:true},
        staleCallback:{label:"旧预约回调迟到",description:"旧修订成功回调只能留痕或补偿，不能恢复旧预约。",danger:true},
        calendarRevoked:{label:"日历权限已失效",description:"Agent 不猜测忙闲、不继续写入，打包给招聘运营处理。",danger:true},
        noCommonSlot:{label:"没有共同时间",description:"候选人没有可选时段，可请求协助；沉默不会变成预约。",danger:true},
        invalidLink:{label:"错人或旧链接",description:"限时、限案件、限修订检查失败；不展示候选人详情、不写状态。",danger:true},
        noticeNoChoice:{label:"告知送达但尚未选择",description:"面试已经安排，录制告知已送达；未选择时录制保持关闭。",danger:true},
        lateParticipant:{label:"邀请转发或晚加入者",description:"参与人变化后录制闸门重新检查；面试照常，录制保持关闭。",danger:true}
      };
      const DANGER_FIXTURE_KEYS=Object.keys(FIXTURES).filter(key=>FIXTURES[key].danger);
      function activity(text,time="刚刚",tone=""){
        return {text,time,tone};
      }
      function baseState(key){
        return {
          fixtureKey:key,step:0,view:0,schedulingState:"PROPOSAL_OPEN",access:"VALID",
          candidate:{name:"林可欣",role:"AI 产品经理",round:"第一轮面试",duration:"45 分钟",interviewerRole:"业务负责人",zone:"新加坡时间（UTC+8）"},
          proposal:{id:"SP-24081",revision:1,expiresAt:"今天 18:00",expired:false},
          slots:clone(DEFAULT_SLOTS),selectedSlotId:"",selectionReceipt:null,
          appointment:{id:"AR-24081",revision:0,status:"NONE",slotId:""},
          receipts:{calendar:null,meeting:null,invite:null},observedResources:{calendar:null,meeting:null,invite:null},
          booking:{status:"NONE",id:"",appointmentRevision:0,slotId:""},currentBooking:null,oldBooking:null,bookingHistory:[],
          recording:{noticeStatus:"DELIVERED",noticeVersion:"RN-v3",choice:"NONE",draft:"",receipt:null,gate:"OFF"},
          conflict:null,conflictHandled:false,exception:null,helpRequested:false,attempts:[],externalEffects:0,
          activity:[activity("已基于批准的面试计划生成三个可选时段","09:20")],
          lastNotice:"等待候选人选择时间"
        };
      }
      function slotOf(state,id){
        return state.slots.find(slot=>slot.id===id)||null;
      }
      function currentSlot(state){
        if(state.currentBooking&&state.currentBooking.slot)return state.currentBooking.slot;
        return slotOf(state,state.appointment.slotId)||slotOf(state,state.selectedSlotId);
      }
      function makeBooked(state,slotId,revision){
        const slot=slotOf(state,slotId)||clone(DEFAULT_SLOTS[0]);
        const booked={status:"BOOKED",id:"BK-24081-R"+revision,appointmentRevision:revision,slotId:slot.id,slot:clone(slot)};
        state.booking=clone(booked);state.currentBooking=clone(booked);state.bookingHistory.push(clone(booked));
        state.appointment={...state.appointment,revision,status:"COMMITTED",slotId:slot.id};
        state.receipts={calendar:"SYN-CAL-R"+revision,meeting:"SYN-MTG-R"+revision,invite:"SYN-INV-R"+revision};
        state.schedulingState="BOOKED";state.step=2;state.view=2;
        return state;
      }
      function createInitial(fixtureKey="normal"){
        const key=FIXTURES[fixtureKey]?fixtureKey:"normal";
        const state=baseState(key);
        if(key==="expiredProposal")state.proposal.expired=true;
        if(key==="noCommonSlot"){state.slots=[];state.lastNotice="当前约束内没有共同时间";}
        if(key==="invalidLink"){state.access="DENIED";state.slots=[];state.candidate={};state.lastNotice="链接无效或已过期";}
        if(key==="reschedule"){
          state.proposal.revision=2;
          state.slots=clone(REPLACEMENT_SLOTS);
          state.oldBooking={status:"BOOKED",id:"BK-24081-R1",appointmentRevision:1,slotId:"old-slot",slot:{id:"old-slot",date:"8 月 13 日 · 周四",time:"10:00–10:45",zone:"新加坡时间（UTC+8）"}};
          state.currentBooking=clone(state.oldBooking);state.booking=clone(state.oldBooking);state.bookingHistory=[clone(state.oldBooking)];
          state.appointment={id:"AR-24081",revision:1,status:"COMMITTED",slotId:"old-slot"};
          state.schedulingState="RESCHEDULING";state.lastNotice="正在改期，原安排仍有效";
          state.activity.push(activity("候选人发起改期；旧预约保持当前有效","09:24"));
        }
        if(key==="staleCallback"){
          state.selectedSlotId="slot-1";state.selectionReceipt={id:"SEL-R2",proposalRevision:1,slotId:"slot-1"};
          state.appointment={id:"AR-24081",revision:2,status:"PENDING",slotId:"slot-1"};
          state.schedulingState="BOOKING_PENDING";state.step=1;state.view=1;state.receipts.calendar="SYN-CAL-R2";
          state.lastNotice="等待当前预约修订完成确认";
        }
        if(key==="noticeNoChoice"){
          makeBooked(state,"slot-1",1);state.recording={...state.recording,choice:"NONE",draft:"",receipt:null,gate:"OFF"};
          state.lastNotice="面试已安排；尚未选择录制，录制保持关闭";
        }
        if(key==="lateParticipant"){
          makeBooked(state,"slot-1",1);
          state.recording={...state.recording,choice:"RECORDING",draft:"RECORDING",receipt:{id:"CR-24081-1",choice:"RECORDING",noticeVersion:"RN-v3"},gate:"BLOCKED_LATE_PARTICIPANT"};
          state.exception={kind:"LATE_PARTICIPANT",title:"参与人发生变化，录制保持关闭",status:"OPEN"};
          state.lastNotice="面试照常进行；新参与人未完成选择前不会录制";
        }
        return state;
      }
      function commitIfComplete(state){
        const complete=["calendar","meeting","invite"].every(kind=>Boolean(state.receipts[kind]));
        if(!complete||!["BOOKING_PENDING","RESCHEDULING"].includes(state.schedulingState))return state;
        if(state.appointment.status!=="PENDING")return state;
        const revision=state.appointment.revision;
        if(state.currentBooking&&state.currentBooking.appointmentRevision===revision)return state;
        if(state.oldBooking)state.oldBooking={...state.oldBooking,status:"REPLACED_PENDING_CANCELLATION"};
        makeBooked(state,state.appointment.slotId,revision);
        state.activity.push(activity("日历、会议和邀请三项当前回执齐全，面试预定已提交","刚刚","good"));
        state.lastNotice="面试已安排";
        return state;
      }
      function transition(input,action){
        const state=clone(input);
        switch(action.type){
          case "SELECT_SLOT":
            if(state.access==="VALID"&&slotOf(state,action.slotId)&&["PROPOSAL_OPEN","RESCHEDULING"].includes(state.schedulingState)){
              state.selectedSlotId=action.slotId;state.lastNotice="已选择时间，尚未提交";
            }
            break;
          case "SUBMIT_SLOT":{
            if(state.access!=="VALID"){state.attempts.push({kind:"ACCESS",result:"DENIED"});state.lastNotice="链接无效，未改变任何安排";break;}
            const selected=slotOf(state,state.selectedSlotId);
            if(!selected){state.lastNotice="请先选择一个时间";break;}
            if(state.proposal.expired){

    function runtimeDetails(){
      const selected=SchedulingMachine.currentSlot(schedulingState);
      return '<details class="fold" data-panel="runtime-details"><summary>运行详情 <span>负责人 / 运营镜像、版本与合成回执</span></summary><div class="fold-body"><div class="runtime-grid"><section class="runtime-card"><h3>负责人 / 运营看到</h3><div class="runtime-row"><span>当前状态</span><b>'+h(internalStatus())+'</b></div><div class="runtime-row"><span>候选时间</span><b>'+(selected?h(selected.date+" "+selected.time):"尚未选择")+'</b></div><div class="runtime-row"><span>下一动作</span><b>'+(schedulingState.schedulingState==="BLOCKED"?"处理这一个问题":schedulingState.schedulingState==="BOOKED"?"查看面试安排":"Agent 继续处理")+'</b></div></section><section class="runtime-card"><h3>预约边界</h3><div class="runtime-row"><span>提案修订</span><b>'+h(schedulingState.proposal.revision)+'</b></div><div class="runtime-row"><span>预约修订</span><b>'+h(schedulingState.appointment.revision)+'</b></div><div class="runtime-row"><span>业务预定</span><b>'+h(schedulingState.booking.status)+'</b></div><div class="runtime-row"><span>原安排</span><b>'+h(schedulingState.oldBooking?.status||"无")+'</b></div></section><section class="runtime-card"><h3>能力真实性</h3><div class="runtime-row"><span>日历回执</span><b>'+h(schedulingState.receipts.calendar?"已确认":"未确认")+'</b></div><div class="runtime-row"><span>会议回执</span><b>'+h(schedulingState.receipts.meeting?"已确认":"未确认")+'</b></div><div class="runtime-row"><span>邀请回执</span><b>'+h(schedulingState.receipts.invite?"已确认":"未确认")+'</b></div><div class="runtime-row"><span>真实外部效果</span><b>0</b></div></section></div>'+scenarioControls()+'<div class="activity-list">'+activityRows()+'</div><div class="callout"><b>外部效果均为合成。</b><br>Demo 不读取真实日历，不创建真实会议，也不向候选人或面试官发送消息。</div></div></details>';
    }
    function scenarioPanel(){
      const selectedKey=SchedulingMachine.DANGER_FIXTURE_KEYS.includes(schedulingState.fixtureKey)?schedulingState.fixtureKey:SchedulingMachine.DANGER_FIXTURE_KEYS[0];
      const fixture=SchedulingMachine.FIXTURES[selectedKey];
      return '<details class="test-panel"><summary>测试其他情况 <span>12 个合成危险场景，不影响默认主路径</span></summary><div class="test-body"><div class="test-grid"><div class="field"><label for="fixture">选择危险场景</label><select id="fixture" data-role="fixture">'+SchedulingMachine.DANGER_FIXTURE_KEYS.map(key=>'<option value="'+a(key)+'" '+(key===selectedKey?"selected":"")+'>'+h(SchedulingMachine.FIXTURES[key].label)+'</option>').join("")+'</select></div><button class="btn secondary" data-action="load-scenario">载入场景</button><button class="btn secondary" data-action="reset-normal">恢复默认体验</button></div><p class="small" style="margin:10px 0 0">'+h(fixture.description)+'</p></div></details>';
    }
    function renderScheduling(){
      const meta=statusMeta();
      const app=document.getElementById("app");if(!app)return;
      app.innerHTML='<div class="demo-note"><b>产品 Demo · 全部为合成数据</b><span>选时不等于预定；录制告知不等于同意。</span></div><div class="shell"><header class="topbar"><div class="brand"><div class="brand-mark">H</div><div class="brand-copy">招聘 Agent<span>候选人约面 Demo</span></div></div><a class="back-link" href="./招聘Agent_核心功能2_画像匹配与部门决定Demo.html">返回简历筛选</a></header><main><section class="page-head"><div class="kicker">候选人约面</div><h1>选择时间，确认后才算安排好</h1><p>你只需要选择方便的时间。Agent 会继续核对日历、会议和邀请；录制选择独立处理，不影响预约和面试机会。</p></section>'+stepper()+mainSurface()+'<section class="folds" aria-label="渐进披露信息">'+runtimeDetails()+scenarioPanel()+'</section><div class="small" style="margin-top:12px">当前状态：'+h(meta[0])+' · '+h(schedulingState.lastNotice)+'</div></main></div>';
      bindScheduling();
    }
    function finishCurrent(){
      clearAutoTimers();
      const revision=schedulingState.appointment.revision;
      ["calendar","meeting","invite"].forEach(kind=>{if(!schedulingState.receipts[kind])schedulingState=SchedulingMachine.transition(schedulingState,{type:"RECEIPT_SUCCEEDED",kind,appointmentRevision:revision,receiptId:"SYN-"+kind.toUpperCase()+"-R"+revision});});
      renderScheduling();focusAfterRender();toast(schedulingState.schedulingState==="BOOKED"?"面试已安排":"仍在确认");
    }
    function startSyntheticProgress(){
      clearAutoTimers();
      const fixture=schedulingState.fixtureKey;
      const revision=schedulingState.appointment.revision;
      if(fixture==="normal"||fixture==="reschedule"){
        [["calendar",650],["meeting",1350],["invite",2050]].forEach(item=>autoTimers.push(setTimeout(()=>dispatch({type:"RECEIPT_SUCCEEDED",kind:item[0],appointmentRevision:revision,receiptId:"SYN-"+item[0].toUpperCase()+"-R"+revision},"",false),item[1])));
      }else if(fixture==="partialSuccess"){
        autoTimers.push(setTimeout(()=>dispatch({type:"RECEIPT_SUCCEEDED",kind:"calendar",appointmentRevision:revision,receiptId:"SYN-CAL-R"+revision},"",false),650));
        autoTimers.push(setTimeout(()=>dispatch({type:"PROVIDER_FAILED",kind:"meeting",appointmentRevision:revision},"",false),1350));
      }else if(fixture==="lostResponse"){
        autoTimers.push(setTimeout(()=>dispatch({type:"RECEIPT_SUCCEEDED",kind:"calendar",appointmentRevision:revision,receiptId:"SYN-CAL-R"+revision},"",false),650));
        autoTimers.push(setTimeout(()=>dispatch({type:"OBSERVE_RESOURCE",kind:"meeting",appointmentRevision:revision,resourceId:"SYN-MEETING-OBSERVED"},"",false),1350));
      }
    }
    function loadScenario(key){
      clearAutoTimers();recordingPanelOpen=false;schedulingState=SchedulingMachine.createInitial(key);
      try{const url=new URL(location.href);url.searchParams.set("scenario",key);history.replaceState({},"",url);}catch(_){}
      renderScheduling();focusAfterRender();toast("已载入："+SchedulingMachine.FIXTURES[key].label);
    }
    function bindScheduling(){
      document.querySelectorAll('input[name="candidate-slot"]').forEach(node=>node.addEventListener("change",()=>dispatch({type:"SELECT_SLOT",slotId:node.value},"",false)));
      document.querySelectorAll('input[name="recording-choice"]').forEach(node=>node.addEventListener("change",()=>dispatch({type:"SET_RECORDING_DRAFT",value:node.value},"",false)));
      const recordingDetails=document.querySelector("details.recording-panel");if(recordingDetails)recordingDetails.addEventListener("toggle",()=>{recordingPanelOpen=recordingDetails.open;});
      document.querySelectorAll("[data-action]").forEach(node=>node.addEventListener("click",()=>{
        const action=node.dataset.action;
        if(action==="submit-slot"){dispatch({type:"SUBMIT_SLOT"});if(["BOOKING_PENDING","RESCHEDULING"].includes(schedulingState.schedulingState))startSyntheticProgress();}
        if(action==="request-help")dispatch({type:"REQUEST_HELP"},"已收到协助请求");
        if(action==="view-booking")toast("这是当前唯一面试安排");
        if(action==="start-reschedule"){clearAutoTimers();dispatch({type:"START_RESCHEDULE"},"原安排会保留到新时间确认完成");}
        if(action==="save-recording")dispatch({type:"SAVE_RECORDING_CHOICE"},"录制选择已单独保存");
        if(action==="skip-recording")dispatch({type:"SKIP_RECORDING"},"录制保持关闭，预约不受影响");
        if(action==="finish-current")finishCurrent();
        if(action==="send-stale")dispatch({type:"RECEIPT_SUCCEEDED",kind:"meeting",appointmentRevision:1,receiptId:"SYN-STALE-MTG-R1"},"旧回调已安全忽略");
        if(action==="reconcile-lost"){
          const revision=schedulingState.appointment.revision;
          schedulingState=SchedulingMachine.transition(schedulingState,{type:"RECONCILE_RESOURCE",kind:"meeting",appointmentRevision:revision});
          schedulingState=SchedulingMachine.transition(schedulingState,{type:"RECEIPT_SUCCEEDED",kind:"invite",appointmentRevision:revision,receiptId:"SYN-INV-R"+revision});
          renderScheduling();focusAfterRender();toast("已有会议已核对，没有重复创建");
        }
        if(action==="load-scenario"){const select=document.querySelector('[data-role="fixture"]');if(select)loadScenario(select.value);}
        if(action==="reset-normal")loadScenario("normal");
      }));
    }
    renderScheduling();
    globalThis.__schedulingDemoTest={
      Machine:SchedulingMachine,
      get state(){return schedulingState;},
      setState(next){clearAutoTimers();schedulingState=JSON.parse(JSON.stringify(next));renderScheduling();},
      renderScheduling,selectionSurface,confirmingSurface,bookedSurface,finishCurrent
    };
  </script>
</body>
</html>
