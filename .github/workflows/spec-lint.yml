name: spec-lint

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  product-spec-consistency:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Check Python syntax
        run: python3 -m compileall -q contracts runtime

      - name: Check JSON syntax
        run: jq empty contracts/*.schema.json

      - name: Check G1a contracts and traceability
        run: python3 contracts/lint_contracts.py

      - name: Check G1b product specification
        run: python3 contracts/lint_g1b_spec.py

      - name: Check G2 product specification
        run: python3 contracts/lint_g2_spec.py

      - name: Check G3 product specification
        run: python3 contracts/lint_g3_spec.py

      - name: Check G1a synthetic control behavior
        run: python3 -m unittest discover -s runtime/tests -v

      - name: Run deterministic G1a synthetic scenario
        run: python3 runtime/run_synthetic_g1a.py

      - name: Run deterministic resume intake scenario
        run: python3 runtime/run_synthetic_intake.py

      - name: Run deterministic screening and department-decision scenario
        run: python3 runtime/run_synthetic_screening.py

      - name: Run deterministic candidate-scheduling scenario
        run: python3 runtime/run_synthetic_scheduling.py

      - name: Check product-shape prototype
        run: node prototype/check_demo.mjs

      - name: Check resume-intake product demo
        run: node prototype/check_intake_demo.mjs

      - name: Check screening and department-decision product demo
        run: node prototype/check_screening_demo.mjs

      - name: Check candidate-scheduling product demo
        run: node prototype/check_scheduling_demo.mjs
